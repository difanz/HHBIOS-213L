# VGA baseline for a later mode 12h smoke of VGA.COM.
# Paths are relative to this file (resolve config path=true):
# captures land in qa/out/captures.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false
showmenu=false

[dosbox]
machine=vgaonly
captures=out/captures
memsize=16
startbanner=false
resolve config path=true

[mixer]
nosound=true

[render]
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=max
