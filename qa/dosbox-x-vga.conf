# VGA baseline. machine=vgaonly.
# captures is resolved from the process working directory (the suite
# cds to the repo root). A case with capture.txt also passes an
# absolute captures directory on the command line.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false
showmenu=false

[dosbox]
machine=vgaonly
captures=qa/out/captures
memsize=16
startbanner=false
resolve config path=true

[mixer]
nosound=true

[render]
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=max
