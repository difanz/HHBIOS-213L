# VBE smoke for VBEPROBE.COM.
# machine=svga_s3: S3 Trio VESA, linear framebuffer available.
# machine=vesa_nolfb: banked VBE, no linear framebuffer.
# captures is resolved from the process working directory.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false
showmenu=false

[dosbox]
machine=svga_s3
captures=qa/out/captures
memsize=16
startbanner=false
resolve config path=true

[video]
vmemsize=4

[mixer]
nosound=true

[render]
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=max
