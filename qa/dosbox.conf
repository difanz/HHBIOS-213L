# Shared VGA test settings for DOSBox and compatible implementations.
# The runner appends a private [autoexec] section for each case.
[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false

[dosbox]
machine=vgaonly
memsize=16

[mixer]
nosound=true

[render]
aspect=false
scaler=none

[cpu]
core=normal
cycles=30000
